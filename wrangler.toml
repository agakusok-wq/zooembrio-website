name = "zooembrio-website"
compatibility_date = "2024-01-01"

# Cloudflare Pages integration: source-of-truth build output directory.
pages_build_output_dir = "./dist"

# Workers Builds integration runs `wrangler deploy`, which requires a Worker
# entry point or a static-assets directory. This static site has neither a
# server entry point nor bindings, so serve the built output as static assets.
[assets]
directory = "./dist"
