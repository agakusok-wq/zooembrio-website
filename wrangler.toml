name = "zooembrio-website"
compatibility_date = "2024-01-01"

# This repo is deployed by two Cloudflare integrations that read this file
# differently:
#   * Workers Builds runs `wrangler deploy`, which needs a Worker entry point or
#     a static-assets directory. This is a static site with no server code, so we
#     serve the built output as static assets.
#   * Cloudflare Pages only treats wrangler.toml as its source of truth when
#     `pages_build_output_dir` is set. That key is intentionally omitted here so
#     Pages ignores this Workers-oriented file and uses its own build settings
#     (build command `npm run build`, output directory `dist`).
[assets]
directory = "./dist"
